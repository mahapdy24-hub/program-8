<!DOCTYPE html>
<html>

<head>

<title>Employee Salary</title>

<script>

function calculateSalary()
{
    var basic = parseFloat(
        document.getElementById("basic").value
    );

    var da = basic * 10 / 100;

    var hra = basic * 20 / 100;

    var pf = basic * 12 / 100;

    var tax = basic * 5 / 100;

    var gross = basic + da + hra;

    var deduction = pf + tax;

    var net = gross - deduction;

    document.getElementById("result").innerHTML =

        "DA = " + da.toFixed(2) +
        "<br>HRA = " + hra.toFixed(2) +
        "<br>PF = " + pf.toFixed(2) +
        "<br>TAX = " + tax.toFixed(2) +
        "<br>Gross Pay = " + gross.toFixed(2) +
        "<br>Deduction = " + deduction.toFixed(2) +
        "<br>Net Pay = " + net.toFixed(2);
}

</script>

</head>

<body>

<h2>Employee Salary</h2>

Basic Pay:

<input type="text" id="basic">

<input type="button"
       value="Calculate"
       onclick="calculateSalary()">

<p id="result"></p>

</body>

</html>
